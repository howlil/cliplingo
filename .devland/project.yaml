schema: devland.project/v0
project:
  name: cliplingo
  types:
    - desktop
product:
  purpose: Provide system-wide, Windows-first offline translation from selected text with a fast popup workflow.
  priorities:
    - reliable text capture and predictable popup behavior
    - privacy and offline normal operation
    - low perceived latency and near-zero idle CPU
    - strong CJK translation quality
    - low memory and disk cost
  non_goals:
    - cloud translation in the normal path
    - OCR in the first working path
    - user accounts
    - database before a real persistent query need exists
    - speculative non-Windows implementation before Windows behavior is proven
platforms:
  - windows
stack:
  languages:
    - rust
    - typescript
    - c++
  frameworks:
    - tauri
    - svelte
  runtimes:
    - node
  data_stores: []
architecture:
  style: native-shell-with-isolated-worker
  document: .agents/DESIGN.md
qualities:
  - performance-sensitive
  - security-sensitive
profiles:
  - project-types.desktop
  - qualities.performance-sensitive
  - qualities.security-sensitive
  - stacks.typescript
  - delivery.desktop-release
delivery:
  model: desktop-release
constraints:
  - selected or translated text must not appear in normal logs or telemetry
  - normal translation must work offline after the required language pack is installed
  - architecture and performance assumptions require benchmark evidence
  - Windows 10/11 is the V1 product platform
  - executable behavior changes use RED then GREEN then REFACTOR before merge
  - plan bounded product and engineering outcomes at milestone boundaries, execute continuously in small coherent vertical slices, and integrate at logical-change boundaries
  - increasing the planning horizon must not increase integration batch size; milestones do not imply milestone branches or all-or-nothing pull requests
  - one coherent logical change or tightly coupled slice stays on one working branch and one pull request through test failures review fixes and CI feedback; trivial changes do not require their own branch merely because they are separate planning items
  - verification expands with risk; native integration privacy security IPC updater release and performance-sensitive changes require broader evidence than local behavior-preserving changes
  - delivery health is evaluated with cycle time PR lead time CI feedback time rework escaped defects change failure flaky tests and work-in-progress age rather than commit branch pull-request or lines-changed counts
  - delivery speed must not bypass privacy security correctness compatibility performance evidence or release-signing requirements
