    kind: foundation
    status: done
    goal: Establish project scope architecture engineering rules release strategy and task-specific skills before implementation.
    group:
      type: iteration
      id: "000"
    scope:
      allowed:
        - product scope and constraints
        - target architecture
        - engineering and Git workflow
        - release strategy
      excluded:
        - application implementation
    acceptance:
