    scope:
      allowed:
        - minimal CMake C++ worker executable
        - local Windows Named Pipe server for protocol v1
        - persistent request loop for one client connection
        - deterministic fake translation response
        - request ID and UTF-8 payload preservation
        - automated Rust client to C++ worker integration test
        - Windows CI worker build and round-trip gate
      excluded:
        - CTranslate2 or SentencePiece integration
        - production model selection
        - shell process supervision integration
        - popup workflow integration
        - installer or package-manager release work
        - manual Windows testing
    acceptance:
      - CI builds cliplingo-worker.exe with the repository Windows runner toolchain
      - C++ worker accepts protocol v1 translate frames over the fixed local pipe
      - two sequential requests on one connection return correlated deterministic responses
      - Unicode UTF-8 payload bytes survive the Rust to C++ to Rust round-trip
