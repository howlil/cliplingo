schema: devland.state/v0
active_work:
  - id: windows-interaction
    kind: feature
    status: verifying
    goal: Ship the first Windows selected-text -> popup -> fake-translation path as an alpha-quality vertical slice.
    group:
      type: iteration
      id: "001"
    scope:
      allowed:
        - global shortcut and selected-text capture
        - popup behavior and monitor-aware positioning
        - deterministic fake translation
        - minimum manual Windows smoke evidence needed for alpha confidence
      excluded:
        - real inference worker
        - OCR
        - all-language routing
        - settings application
        - installer or package-manager release work
        - exhaustive compatibility matrix
        - stable-grade performance certification
    acceptance:
      - mandatory frontend and Rust CI gates pass on the final head
      - happy-path manual smoke passes on representative selectable Windows applications
      - stale requests cannot overwrite newer state
      - clipboard fallback preserves existing content or safely refuses unsupported restoration
      - no selected or translated text appears in logs
      - popup remains usable on the tested Windows display configuration
    artifacts:
      spec: null
      plan: .agents/plans/001-windows-interaction.md
      evidence: []
    branch: feat/iteration-001-windows-interaction
    pull_request: "#3"
blocked:
  - id: windows-alpha-smoke
    work: windows-interaction
    reason: Final manual Windows alpha smoke evidence has not yet been recorded. Do not expand this blocker into exhaustive beta/stable compatibility or benchmark work.
recently_completed:
  - id: engineering-foundation
    kind: foundation
    status: done
    goal: Establish project scope architecture engineering rules release strategy and task-specific skills before implementation.
    group:
      type: iteration
      id: "000"
    scope:
      allowed:
        - product scope and constraints
        - target architecture
        - engineering and Git workflow
        - release strategy
      excluded:
        - application implementation
    acceptance:
      - project and architecture documentation exist
      - current implementation plan is defined
    artifacts:
      spec: .agents/PROJECT.md
      plan: null
      evidence:
        - .agents/DESIGN.md
        - .agents/RULES.md
        - .agents/SDLC.md
    branch: null
    pull_request: null
open_decisions:
  - which Windows applications require clipboard fallback rather than UI Automation
  - first production-quality translation model and language direction
  - direct CJK-to-Indonesian models versus English-pivot routes
  - final beta/stable latency and resource budgets
  - Windows code-signing provider and certificate strategy
