schema: devland.state/v0
active_work:
  - id: windows-interaction
    kind: feature
    status: planned
    goal: Prove selected-text capture and fast popup interaction on Windows without real ML inference.
    group:
      type: iteration
      id: "001"
    scope:
      allowed:
        - global shortcut and selected-text capture
        - popup behavior and monitor-aware positioning
        - deterministic fake translation
        - compatibility latency memory CPU and privacy measurement
      excluded:
        - real inference worker
        - OCR
        - all-language routing
        - settings application
        - installer or package-manager release work
    acceptance:
      - frontend and Rust quality gates pass
      - representative selectable Windows applications are checked
      - stale requests cannot overwrite newer state
      - clipboard fallback preserves or safely refuses unsupported existing clipboard data
      - popup placement is verified across relevant DPI and monitor conditions
      - no selected or translated text appears in logs
      - latency idle memory idle CPU and compatibility evidence are recorded
    artifacts:
      spec: null
      plan: .agents/plans/001-windows-interaction.md
      evidence: []
    branch: null
    pull_request: null
blocked: []
