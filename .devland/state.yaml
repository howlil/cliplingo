  - id: worker-supervisor-lifecycle
    kind: feature
    status: done
    goal: Establish deterministic WorkerSupervisor lifecycle transitions and a bounded automatic restart budget before native process transport is introduced.
    group:
      type: milestone
      id: isolated-inference-boundary-alpha
    scope:
      allowed:
        - Stopped Starting Ready Busy Failed state model
        - deterministic valid and invalid transitions
        - bounded automatic restart attempts
        - explicit intentional stop and restart-budget reset
        - automated state-machine tests
      excluded:
        - process spawn or termination
        - Windows Named Pipe APIs
        - retry timing or backoff
        - C++ worker implementation
        - CTranslate2 or SentencePiece integration
        - production model selection
        - UI behavior changes
        - manual Windows testing
    acceptance:
      - normal start ready busy ready lifecycle is deterministic
      - invalid transitions fail without mutating state
      - worker failure reaches Failed without crashing caller state
      - automatic restarts cannot exceed configured budget
      - reaching Ready does not silently create an infinite restart cycle
      - intentional stop returns to Stopped and rearms the restart budget
      - CI run 61 passed all automated gates on the final code head
