<style>

*{box-sizing:border-box}

.lab{max-width:1220px;margin:auto;padding:18px 18px 36px}

.search svg{width:15px;height:15px}.search input{border:0;outline:0;background:none;width:100%;min-width:0;color:var(--ink);font-size:12px}.search input:focus-visible{outline:0}.search:focus-within{box-shadow:0 0 0 1px var(--accent)}

.actions-inline{display:flex;gap:6px;align-items:center}.textbtn{border:0;background:transparent;padding:7px 9px;border-radius:7px;font-size:12px;display:inline-flex;align-items:center;gap:7px;color:var(--secondary);white-space:nowrap}.textbtn svg{width:16px;height:16px}

.single .library{display:none}.single{grid-template-columns:1fr}.single .detail-inner{max-width:770px}

.empty-message{width:100%;max-width:450px;padding:24px;text-align:center}.empty-symbol{width:46px;height:46px;border-radius:13px;background:var(--control);display:grid;place-items:center;margin:auto auto 15px;color:var(--secondary)}.empty-symbol svg{width:22px;height:22px}.empty-message h2{font-size:22px;letter-spacing:-.5px;font-weight:630}.empty-message p{font-size:13px;line-height:1.65;color:var(--secondary);margin:9px 0 19px}

.settings-content{max-width:650px;margin:0 auto}.settings-content h1{font-size:24px;letter-spacing:-.5px;margin:4px 0 21px;font-weight:650}
.setting-group{margin-bottom:24px}.setting-group h2{font-size:12px;margin:0 0 8px;font-weight:630;color:var(--secondary)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:51px;border-bottom:1px solid var(--hairline);padding:9px 0}.setting-row strong{font-size:12px;font-weight:540}.setting-row small{display:block;color:var(--secondary);font-size:11px;margin-top:2px;line-height:1.4}.setting-row select,.setting-row input[type=text]{background:var(--control);color:var(--ink);border:0;border-radius:7px;padding:7px 9px;font-size:12px;min-width:145px;max-width:220px}.setting-row input[type=range]{max-width:180px;accent-color:var(--accent)}.setting-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.settings-error{font-size:11px;color:var(--danger);padding-top:6px;min-height:20px}
.document-window{display:block;position:relative;background:var(--window)}
.docbar{height:54px;padding:0 22px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--hairline);color:var(--secondary);font-size:13px}
.doc-actions{margin-left:auto;display:flex;gap:18px;align-items:center}.doc-actions svg{width:19px;height:19px}
.paper{max-width:800px;margin:auto;padding:57px 28px 40px}
.paper small{color:var(--secondary);font-size:13px}.paper h1{font-size:clamp(28px,4.2vw,42px);line-height:1.17;letter-spacing:-1.1px;font-weight:670;max-width:690px;margin:21px 0 30px}.paper p{font-size:16px;line-height:1.85;color:var(--ink);margin:0 0 22px}.paper mark{background:color-mix(in srgb,var(--accent) 18%,var(--window));color:var(--accent);padding:2px 4px;border-radius:5px;font-weight:650}
.popover{position:absolute;left:41%;top:325px;transform:translateX(-50%);width:min(var(--popwidth,430px),calc(100% - 36px));background:var(--panel);border-radius:23px;box-shadow:var(--popover-shadow);overflow:visible;animation:popover-enter 230ms var(--ease) both;display:flex;flex-direction:column;max-height:335px;z-index:3}
@keyframes popover-enter{from{opacity:0;transform:translateX(-50%) translateY(9px) scale(.986)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.popover-arrow{position:absolute;left:26px;top:-8px;width:16px;height:16px;background:var(--glass);transform:rotate(45deg);border-radius:3px;z-index:-1}
.pop-header{height:52px;flex-shrink:0;border-radius:23px 23px 0 0;padding:0 15px 0 17px;background:var(--glass);backdrop-filter:blur(10px);display:flex;align-items:center;gap:9px}
.pop-appicon{background:linear-gradient(155deg,#75b8ff,#5573e4 65%,#6444cc);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:white;font-weight:650;font-size:17px;box-shadow:0 1px 5px rgba(50,99,201,.16)}
.pop-brand{font-weight:640;font-size:13px}.pop-divider{width:1px;height:18px;background:var(--hairline);margin:0 6px}
.pop-language{font-size:12px;color:var(--secondary)}.pop-close{margin-left:auto;background:var(--control);width:27px;height:27px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--secondary)}.pop-close:hover{background:var(--control-hover)}.pop-close svg{width:15px;height:15px}
.pop-content{padding:10px 22px 17px;overflow:auto;min-height:92px;scrollbar-width:thin;white-space:normal}
.translation{font-size:27px;line-height:1.31;font-weight:680;letter-spacing:-.8px;overflow-wrap:anywhere;white-space:pre-line}
.translation.long{font-size:14px;line-height:1.7;letter-spacing:0;font-weight:460}
.pop-note{font-size:12.5px;line-height:1.6;color:var(--secondary);margin-top:10px;overflow-wrap:anywhere}
.pop-status-title{font-size:16px;font-weight:620;margin:0 0 7px}.pop-status-copy{font-size:12px;line-height:1.65;color:var(--secondary)}.pop-error-action{margin-top:12px}
.loading-line{height:3px;background:var(--control);border-radius:2px;overflow:hidden;margin:17px 0 4px;position:relative}
.loading-line:after{content:"";position:absolute;height:100%;width:35%;left:-35%;background:var(--accent);border-radius:2px;animation:loading 1.2s ease-in-out infinite}@keyframes loading{to{left:120%}}
.pop-footer{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:3px;padding:7px 12px 10px 14px;border-radius:0 0 23px 23px;background:var(--panel)}
.pop-action{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;white-space:nowrap;border:0;background:transparent;padding:8px 4px;border-radius:9px;color:var(--ink);font-size:11.5px;font-weight:490;min-height:34px}
.pop-action:hover{background:var(--control)}.pop-action svg{width:17px;height:17px;color:var(--secondary)}
.pop-separator{height:20px;width:1px;background:var(--hairline)}
.demo-footer{max-width:1080px;margin:11px auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:var(--secondary);font-size:11px;line-height:1.55;flex-wrap:wrap}
.demo-extras{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.demo-extras button{border:0;background:color-mix(in srgb,var(--window) 70%,transparent);padding:6px 9px;font-size:11px;border-radius:7px;color:var(--secondary);min-height:28px}.demo-extras button.active{color:var(--ink);background:var(--highlight)}
.toast{position:absolute;bottom:15px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--window);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:13px;box-shadow:0 7px 25px rgba(0,0,0,.16);font-size:12px;transition:transform var(--state) var(--ease),opacity var(--state) var(--ease);z-index:8;white-space:nowrap}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}.toast button{border:0;background:transparent;color:#7db9ff;font-size:12px;padding:2px 3px}
.window.narrow .main{grid-template-columns:1fr}.window.narrow .library{border-right:0}.window.narrow .main:not(.mobile-detail) .detail{display:none}.window.narrow .main.mobile-detail .library{display:none}.window.narrow .main.mobile-detail .detail{display:block}.window.narrow .mobile-back{display:inline-flex}.window.narrow .detail-inner{padding:22px 24px}.window.narrow .word-heading{font-size:32px}.window.narrow .word-meaning{font-size:23px}
@media(max-width:650px){.lab{padding:12px 10px 24px}.demo-brand small{display:none}.canvas{min-height:560px}.window,.document-window{height:540px;border-radius:14px}.main{grid-template-columns:1fr}.library{border-right:0}.main:not(.mobile-detail) .detail{display:none}.main.mobile-detail .library{display:none}.main.mobile-detail .detail{display:block}.mobile-back{display:inline-flex}.detail-inner{padding:21px 22px}.word-heading{font-size:32px}.word-meaning{font-size:23px}.windowbar{padding:0 13px}.traffic{gap:5px;margin-right:3px}.traffic span{width:9px;height:9px}.paper{padding:42px 24px}.paper p{font-size:13px}.popover{top:290px;left:50%;max-height:300px}.popover-arrow{left:28px}.pop-content{padding:12px 17px}.pop-footer{padding:7px}.pop-action{font-size:10px;gap:4px}.pop-action svg{width:15px}.settings-pane{padding:18px}.setting-row{align-items:flex-start}.setting-row select{min-width:100px}}

</style>
</head>
<body>
<main class="lab">
  <header class="demo-bar"><div class="demo-brand"><strong>ClipLingo</strong><small>Design preview · simulated data</small></div><div class="demo-controls"><div class="segment" role="group" aria-label="Preview surface"><button id="show-library" class="active">Vocabulary</button><button id="show-popup">Popup</button></div><select id="density" aria-label="Demo collection size"><option value="36">36 saved words</option><option value="0">0 words</option><option value="1">1 word</option><option value="2400">2,400 words</option></select><div class="segment" role="group" aria-label="Preview width"><button id="wide" class="active">Wide</button><button id="narrow">Narrow</button></div><button class="demo-theme" id="theme" title="Toggle light / dark" aria-label="Toggle appearance"></button></div></header>
  <div class="canvas" id="canvas">
    <div class="window" id="app-window"><div class="windowbar" id="windowbar"></div><div id="app-body" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>
    <div class="document-window" id="popup-scene" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="demo-footer"><span>Interactive prototype · Windows implementation not connected · macOS-inspired visual language</span><div class="demo-extras" id="popup-demo-controls" hidden><button data-sample="word" class="active">Word</button><button data-sample="sentence">Sentence</button><button data-sample="paragraph">Paragraph</button><span aria-hidden="true">·</span><button data-status="loading">Loading</button><button data-status="error">Error</button><button data-status="noselection">No selection</button><button data-status="consent">Consent</button><button id="retrigger">Translate again</button></div></div>
</main>
<script>
(()=>{

  document.addEventListener('change',e=>{const t=e.target;if(t.id==='sort'){state.sort=t.value;renderApp()}if(t.id==='language')state.pair=t.value;if(t.id==='online')state.online=t.checked;if(t.id==='context-switch')state.context=t.checked;if(t.id==='shortcut'){const v=t.value.trim();if(!/^(Ctrl|Alt|Shift|Win)(\s*\+\s*(Ctrl|Alt|Shift|Win))*\s*\+\s*[A-Z0-9]$/i.test(v)||/^(Ctrl\s*\+\s*[CLV]|Alt\s*\+\s*F4)$/i.test(v)){state.shortcutError='Choose a shortcut with a modifier and one key, e.g. Ctrl + Alt + L';t.value=state.shortcut;$('shortcut-error').textContent=state.shortcutError}else{state.shortcut=v;state.shortcutError='';$('shortcut-error').textContent=''}}});
  document.addEventListener('submit',e=>{if(e.target.id==='manual-form'){e.preventDefault();const text=$('manual-input')?.value.trim();if(!text)return;sample.word={term:text.toLowerCase(),source:text,result:'Terjemahan simulasi: '+text,note:'Demo text is not sent to a translation provider.',saveMeaning:'terjemahan simulasi'};state.popupSample='word';showStatus('result')}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.surface==='popup'&&state.popupStatus!=='closed'){showStatus('closed')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&state.surface==='library'&&state.route==='vocabulary'){e.preventDefault();$('search-field')?.focus()}if(e.target.id==='rows-scroll'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const arr=filtered(),i=arr.findIndex(x=>x.id===state.selected);const next=Math.max(0,Math.min(arr.length-1,i+(e.key==='ArrowDown'?1:-1)));if(arr[next]){state.selected=arr[next].id;renderDetail();const sc=$('rows-scroll');if(sc)sc.scrollTop=Math.max(0,next*53-sc.clientHeight/2)}}});
  $('show-library').onclick=()=>setSurface('library');$('show-popup').onclick=()=>setSurface('popup');$('theme').onclick=()=>{state.dark=!state.dark;paintDemo()};
  $('density').onchange=e=>{state.collectionSize=+e.target.value;state.query='';state.selected=state.collectionSize===1?'base-2':'base-2';state.mobileDetail=false;state.route='vocabulary';renderApp()};
  $('wide').onclick=()=>{state.narrow=false;state.mobileDetail=false;paintDemo();renderApp()};$('narrow').onclick=()=>{state.narrow=true;state.mobileDetail=false;paintDemo();renderApp()};
  document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{state.popupSample=b.dataset.sample;showStatus('result')});
  document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{if(b.dataset.status==='loading')translate();else showStatus(b.dataset.status)});
  $('retrigger').onclick=translate;
  paintDemo();renderApp();
})();
</script>
</body>
</html>
