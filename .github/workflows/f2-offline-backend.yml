name: F2 Optional CTranslate2 Windows backend compile
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/f2-offline-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f2-ct2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cpu-native:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows CMake
        run: cmake --version
      - name: Build optional real CTranslate2 feature
        run: cargo check --manifest-path src-tauri/Cargo.toml --features offline-ct2
