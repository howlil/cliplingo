name: F2 Optional CTranslate2 Windows backend compile
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/f2-offline-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f2-ct2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cpu-native:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      # ct2rs CMake forces /MT; the Rust CXX bridge must use /MT too.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: f2-ct2-native-windows
      - name: Windows CMake
        run: cmake --version
      - name: Build optional real CTranslate2 feature
        run: cargo check --manifest-path src-tauri/Cargo.toml --features offline-ct2
      - name: Python 3.11 for model conversion (CI only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned model converter dependencies
        run: python -m pip install "ctranslate2==4.8.3" "transformers>=4.49,<5" "huggingface_hub>=0.30,<1" "hf_xet>=1,<2" sentencepiece torch
      - name: Convert real public EN-ID model to verified local INT8 pack
        shell: pwsh
        run: |
          python scripts/prepare-en-id-pack.py --output "$env:LOCALAPPDATA\ClipLingo\models\en-id"
      - name: A/B measure verified model with baseline and greedy CPU inference profiles
        shell: pwsh
        run: |
          $profiles = @(
            @{ Beam = 2; Threads = 2 },
            @{ Beam = 1; Threads = 2 },
            @{ Beam = 1; Threads = 1 },
            @{ Beam = 1; Threads = 4 }
          )
          foreach ($profile in $profiles) {
            Write-Host "Native EN-ID profile: beam=$($profile.Beam) threads=$($profile.Threads)"
            cargo run --manifest-path src-tauri/Cargo.toml --features offline-ct2 --bin offline_model_smoke -- --benchmark --beam $profile.Beam --threads $profile.Threads
            if ($LASTEXITCODE -ne 0) { throw "Native model benchmark failed for beam=$($profile.Beam) threads=$($profile.Threads)" }
          }
