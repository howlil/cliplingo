name: Publish recovered verified ClipLingo beta 1
# One-time release recovery. The source archive and executable were fully
# verified in run 40222010686; only the GitHub Releases POST failed (403).
# Trigger only when this file first lands on master.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/recover-beta1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cliplingo-beta1-recovery
  cancel-in-progress: false
jobs:
  recover:
    name: Publish verified beta 1 from successful CI artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original artifact source matches current product exactly
        shell: bash
        env:
          SOURCE_SHA: 63ed25fe374a73f9b42e2c3501770c06ed89fbb1
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          git cat-file -e "$SOURCE_SHA^{commit}"
          # All runtime/build/package/model logic is identical; only CI files
          # changed after the verified build. Never republish mismatched code.
          if ! git diff --quiet "$SOURCE_SHA" "$GITHUB_SHA" -- \
            src CMakeLists.txt \
            tools/build_en_id_pack.py tools/verify_en_id_pack.py \
            tools/package_release.ps1 tools/next_release_version.py \
            RELEASE_NOTES.md; then
            echo "::error::App/model/package code differs from validated run: rebuild required."
            git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA"
            exit 1
          fi
      - name: Retrieve verified English-Indonesian model ZIP
        uses: actions/download-artifact@v4
        with:
          name: cliplingo-offline-model
          run-id: 40222010686
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Retrieve verified portable Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: cliplingo-windows
          run-id: 40222010686
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Assert both verified ZIPs and create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s ClipLingo-v0.1.0-beta.1-en-id-model.zip
          test -s ClipLingo-v0.1.0-beta.1-win-x64.zip
          unzip -tq ClipLingo-v0.1.0-beta.1-en-id-model.zip
          unzip -tq ClipLingo-v0.1.0-beta.1-win-x64.zip
          unzip -Z1 ClipLingo-v0.1.0-beta.1-win-x64.zip | grep -qx ClipLingo.exe
          unzip -Z1 ClipLingo-v0.1.0-beta.1-en-id-model.zip | grep -qx en-id/cliplingo-model.sha256
          sha256sum ClipLingo-v0.1.0-beta.1-*.zip > SHA256SUMS.txt
      - name: Publish verified prerelease from current default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.0-beta.1
        run: |
          set -euo pipefail
          MASTER_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)"
          if [[ "$MASTER_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Release source became stale; master now $MASTER_SHA"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; not replacing assets."
          else
            sed "s/__VERSION__/$TAG/g" RELEASE_NOTES.md > release-notes-rendered.md
            gh release create "$TAG" \
              release-assets/ClipLingo-v0.1.0-beta.1-win-x64.zip \
              release-assets/ClipLingo-v0.1.0-beta.1-en-id-model.zip \
              release-assets/SHA256SUMS.txt \
              --target master \
              --title "ClipLingo $TAG" \
              --notes-file release-notes-rendered.md \
              --prerelease --latest=false
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets,url --jq \
            '{tagName,isPrerelease,url,assets:[.assets[].name]}'
          TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          [[ "$TAG_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::Published tag SHA does not match tested source"
            exit 1
          }
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/actual
          printf '%s\n' \
            ClipLingo-v0.1.0-beta.1-en-id-model.zip \
            ClipLingo-v0.1.0-beta.1-win-x64.zip \
            SHA256SUMS.txt | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
