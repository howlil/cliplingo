name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify risk
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      rust: ${{ steps.paths.outputs.rust }}
      model: ${{ steps.paths.outputs.model }}
      native: ${{ steps.paths.outputs.native }}
      distribution: ${{ steps.paths.outputs.distribution }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed risk surfaces
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          rust=false
          model=false
          native=false
          distribution=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base" "$head")"
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" == .github/workflows/* ]]; then
              frontend=true
              rust=true
              model=true
              native=true
              distribution=true
            fi

            if [[ "$file" == app/src/* || "$file" == app/index.html || "$file" == app/package.json || "$file" == app/package-lock.json || "$file" == app/vite.config.* || "$file" == app/tsconfig*.json ]]; then
              frontend=true
            fi

            if [[ "$file" == app/src-tauri/* ]]; then
              rust=true
            fi

            if [[ "$file" == models/* || "$file" == scripts/models/* || "$file" == app/src-tauri/src/*model_pack* ]]; then
              model=true
            fi

            if [[ "$file" == worker/* || "$file" == app/src-tauri/tests/worker_* || "$file" == app/src-tauri/src/*worker* || "$file" == app/src-tauri/src/*protocol* || "$file" == app/src-tauri/Cargo.toml || "$file" == app/src-tauri/Cargo.lock ]]; then
              native=true
            fi

            if [[ "$file" == scripts/install.ps1 ]]; then
              distribution=true
            fi
          done <<< "$changed_files"

          {
            echo "frontend=$frontend"
            echo "rust=$rust"
            echo "model=$model"
            echo "native=$native"
            echo "distribution=$distribution"
          } >> "$GITHUB_OUTPUT"

          printf 'risk lanes: frontend=%s rust=%s model=%s native=%s distribution=%s\n' "$frontend" "$rust" "$model" "$native" "$distribution"

  frontend:
    name: frontend
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static check
        run: npm run check
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build

  rust:
    name: rust core
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint production targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib --bins --all-features -- -D warnings
      - name: Unit and application tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  model-contract:
    name: model contract
    needs: classify
    if: needs.classify.outputs.model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - name: Validate EN-ID model-pack plan
        run: python ../scripts/models/build_opus_pack.py --catalog ../models/catalog/en-id-opus-v1.json --output ../models/build/en-id-opus-v1 --dry-run

  native:
    name: native boundary
    needs: classify
    if: needs.classify.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Configure C++ worker runtime
        run: cmake -S ../worker -B ../worker/build -A x64
      - name: Build worker and runtime probe
        shell: pwsh
        run: |
          $buildOutput = & cmake --build ../worker/build --config Release --target cliplingo_worker cliplingo_worker_runtime_probe 2>&1
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $diagnostics = $buildOutput | Select-String -Pattern 'LNK[0-9]+|unresolved external|fatal error|error:'
            if ($diagnostics) {
              $diagnostics | ForEach-Object { Write-Host $_.Line }
            } else {
              $buildOutput | Select-Object -Last 80 | ForEach-Object { Write-Host $_ }
            }
            exit $buildExitCode
          }
      - name: Verify native translation runtime
        timeout-minutes: 3
        shell: pwsh
        run: |
          & "../worker/build/Release/cliplingo-worker-runtime-probe.exe" `
            "../worker/build/_deps/ctranslate2-src/tests/data/models/v2/aren-transliteration-i8" `
            "../worker/build/_deps/sentencepiece-src/data/botchan_1000_bpe.model"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Rust to C++ protocol boundary
        shell: pwsh
        env:
          CLIPLINGO_WORKER_EXE: ${{ github.workspace }}\worker\build\Release\cliplingo-worker.exe
          CLIPLINGO_WORKER_TEST_MODE: deterministic
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test worker_cpp_integration -- --ignored --nocapture
      - name: Verify worker-backed translator
        shell: pwsh
        env:
          CLIPLINGO_WORKER_EXE: ${{ github.workspace }}\worker\build\Release\cliplingo-worker.exe
          CLIPLINGO_WORKER_TEST_MODE: deterministic
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test worker_translator_integration -- --ignored --nocapture
      - name: Compile real-production smoke harness
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test worker_real_translation_smoke --no-run

  distribution:
    name: powershell installer
    needs: classify
    if: needs.classify.outputs.distribution == 'true'
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Parse installer bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Resolve latest release and checksum metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/install.ps1 -ResolveOnly

  required:
    name: required
    if: always()
    needs: [classify, frontend, rust, model-contract, native, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce proportional CI result
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          MODEL: ${{ needs.model-contract.result }}
          NATIVE: ${{ needs.native.result }}
          DISTRIBUTION: ${{ needs.distribution.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY" "$FRONTEND" "$RUST" "$MODEL" "$NATIVE" "$DISTRIBUTION"; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI lane failed or was cancelled: $result" >&2; exit 1 ;;
            esac
          done
