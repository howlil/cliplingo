name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Rust lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Apply Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Frontend check
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Rust formatting gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        shell: pwsh
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Rust diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-diagnostics
          path: app/clippy.log
          if-no-files-found: ignore
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all
      - name: Commit deterministic bootstrap outputs
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json app/src-tauri/Cargo.lock app/src-tauri/src
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: lock dependencies and normalize Rust sources"
            git push origin HEAD:${{ github.head_ref }}
          }
