name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend check
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Validate offline model pack plan
        run: python ../scripts/models/build_opus_pack.py --catalog ../models/catalog/ja-id-opus-v1.json --output ../models/build/ja-id-opus-v1 --dry-run
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Rust diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-diagnostics
          path: app/clippy.log
          if-no-files-found: ignore
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all
      - name: Configure deterministic C++ worker
        run: cmake -S ../worker -B ../worker/build -A x64
      - name: Build deterministic C++ worker
        run: cmake --build ../worker/build --config Release
      - name: Verify Rust to C++ worker boundary
        shell: pwsh
        env:
          CLIPLINGO_WORKER_EXE: ${{ github.workspace }}\worker\build\Release\cliplingo-worker.exe
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test worker_cpp_integration -- --ignored --nocapture
      - name: Verify worker-backed translator
        shell: pwsh
        env:
          CLIPLINGO_WORKER_EXE: ${{ github.workspace }}\worker\build\Release\cliplingo-worker.exe
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test worker_translator_integration -- --ignored --nocapture
      - name: Validate acceptance collector
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ../scripts/windows/iteration-001-acceptance.ps1),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build acceptance executable
        if: github.event_name == 'pull_request'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Stage acceptance package
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $package = "acceptance-package"
          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "src-tauri/target/debug/cliplingo.exe" "$package/cliplingo.exe"
          Copy-Item "../worker/build/Release/cliplingo-worker.exe" "$package/cliplingo-worker.exe"
          Copy-Item "../scripts/windows/iteration-001-acceptance.ps1" "$package/acceptance.ps1"
          @"
          source_head_sha=$env:SOURCE_HEAD_SHA
          ci_checkout_sha=$env:GITHUB_SHA
          run_id=$env:GITHUB_RUN_ID
          "@ | Set-Content "$package/build-info.txt" -Encoding utf8
      - name: Upload Windows acceptance package
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: iteration-001-windows-acceptance-${{ github.event.pull_request.number }}
          path: app/acceptance-package
          if-no-files-found: error
