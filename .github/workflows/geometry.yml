name: M1 Windows host smoke
on:
  # One validation for each PR commit; do not also run on its feature-branch push.
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/geometry.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/geometry.yml'

concurrency:
  group: cliplingo-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  geometry:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Windows geometry test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cl /nologo /std:c++20 /W4 /WX /EHsc /Isrc tests\geometry_test.cpp /Fe:geometry_test.exe && geometry_test.exe"
      - name: Configure Windows host with inference stub
        shell: pwsh
        run: cmake -S . -B build-smoke -A x64 -DCLIPLINGO_HOST_SMOKE=ON
      - name: Compile native Win32 host (no CTranslate2)
        shell: pwsh
        run: cmake --build build-smoke --config Release --parallel 2
      - name: Reject benchmark when model is missing (no fake performance report)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location) "build-smoke/Release/ClipLingoHostSmoke.exe"
          $model = Join-Path $env:RUNNER_TEMP "cliplingo-no-model"
          $report = Join-Path $env:RUNNER_TEMP "cliplingo-no-model-benchmark.json"
          if (Test-Path $report) { Remove-Item $report -Force }
          $args = '--benchmark-model "' + $model + '" "' + $report + '" 5'
          $proc = Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait
          if ($proc.ExitCode -ne 5) {
            throw "Expected ModelMissing/invalid stub benchmark exit code 5, got $($proc.ExitCode)"
          }
          if (Test-Path $report) { throw "Invalid model produced a fake benchmark report" }

      - name: Test model pack integrity
        shell: pwsh
        run: ctest --test-dir build-smoke -C Release --output-on-failure

      - name: Check CTranslate2 and SentencePiece native API compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depRoot = Join-Path $env:RUNNER_TEMP 'cliplingo-api'
          New-Item -ItemType Directory -Force $depRoot | Out-Null
          git clone --quiet --depth 1 --branch v4.8.3 https://github.com/OpenNMT/CTranslate2.git (Join-Path $depRoot 'CTranslate2')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --quiet --depth 1 --branch v0.2.1 https://github.com/google/sentencepiece.git (Join-Path $depRoot 'sentencepiece')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $ct2 = Join-Path $depRoot 'CTranslate2\include'
          $spm = Join-Path $depRoot 'sentencepiece\src'
          $command = "`"$vcvars`" && cl /nologo /std:c++20 /EHsc /W4 /permissive- /utf-8 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Isrc /I`"$ct2`" /I`"$spm`" /c src\translation.cpp /Fo:translation_api.obj"
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
